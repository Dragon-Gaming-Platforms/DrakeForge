<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#000000" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<!--
			Cross-origin isolation for BrowserPod's SharedArrayBuffer. GitHub Pages cannot set
			COOP/COEP headers itself, so coi-serviceworker adds them on the first top-level
			visit and reloads once. When DrakeForge is embedded in Dragon86, the already-isolated
			top page supplies isolation and this frame must NOT register its own worker.
			This script must run before every other script.
		-->
		<script>
			window.coi = {
				shouldRegister: () => window.parent === window && window.crossOriginIsolated !== true,
				shouldDeregister: () => false,
				coepCredentialless: () => false,
				coepDegrade: () => false,
				quiet: true
			};
		</script>
		<script src="%sveltekit.assets%/coi-serviceworker.js"></script>
		<link
			rel="alternate"
			type="text/markdown"
			title="DrakeForge for AI assistants"
			href="%sveltekit.assets%/llms.txt"
		/>
		<title>DrakeForge — BrowserCode IDE for Dragon86</title>
		<meta
			name="description"
			content="BrowserCode with a live Dragon86 fs1 filesystem bridge and a standalone in-browser 9p server."
		/>
		<meta property="og:site_name" content="DrakeForge" />
		<meta property="og:title" content="DrakeForge — BrowserCode IDE for Dragon86" />
		<meta
			property="og:description"
			content="A full BrowserCode IDE that connects to Dragon86's ZenFS filesystem, plus a standalone 9p-backed mode."
		/>
		<meta
			property="og:image"
			content="https://dragon-gaming-platforms.github.io/DrakeForge/og-v2.png"
		/>
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="675" />
		<meta property="og:image:alt" content="DrakeForge" />
		<meta property="og:type" content="website" />
		<meta property="og:url" content="https://dragon-gaming-platforms.github.io/DrakeForge/" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="DrakeForge — BrowserCode IDE for Dragon86" />
		<meta
			name="twitter:description"
			content="BrowserCode with a live Dragon86 fs1 filesystem bridge and a standalone in-browser 9p server."
		/>
		<meta
			name="twitter:image"
			content="https://dragon-gaming-platforms.github.io/DrakeForge/og-v2.png"
		/>
		<meta property="twitter:domain" content="dragon-gaming-platforms.github.io" />
		<meta property="twitter:url" content="https://dragon-gaming-platforms.github.io/DrakeForge/" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
